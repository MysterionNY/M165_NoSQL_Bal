#cloud-config
package_update: true

packages:
  - prometheus
  - python3-venv
  - python3-pip
  - wget
  - apt-transport-https
  - software-properties-common
  - gnupg

write_files:
  - path: /home/ubuntu/monitoring/script.py
    owner: ubuntu:ubuntu
    permissions: '0644'
    content: |
      import time
      import random

      def process_upload():
          file_types = ['image/png', 'image/jpeg', 'video/mp4']
          file_type = random.choice(file_types)

          # 90% Erfolgsquote
          if random.random() > 0.1:
              status = 'success'
              print(f"[UPLOAD] {file_type} erfolgreich gespeichert.")
          else:
              status = 'error_file_too_large'
              print(f"[UPLOAD] FEHLER: {file_type} ist zu gross!")

      if __name__ == '__main__':
          print("Starte Datei-Upload Simulation...")

          while True:
              process_upload()
              time.sleep(random.uniform(0.2, 1.5))

runcmd:
  - mkdir -p /home/ubuntu/monitoring
  - chown -R ubuntu:ubuntu /home/ubuntu/monitoring

  # Grafana Repository hinzufügen und installieren
  - mkdir -p /etc/apt/keyrings
  - wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" > /etc/apt/sources.list.d/grafana.list
  - apt-get update
  - apt-get install -y grafana
  - systemctl enable grafana-server
  - systemctl start grafana-server

  # Prometheus starten
  - systemctl enable prometheus
  - systemctl start prometheus

  # Python Virtual Environment vorbereiten
  - sudo -u ubuntu python3 -m venv /home/ubuntu/monitoring/.venv
  - sudo -u ubuntu /home/ubuntu/monitoring/.venv/bin/pip install prometheus-client