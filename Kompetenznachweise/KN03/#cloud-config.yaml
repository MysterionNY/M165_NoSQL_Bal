#cloud-config
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups:
      - users
      - sudo
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  teacher-key
      - ssh-rsa  mert
      
ssh_pwauth: false
disable_root: true
package_update: true
packages:
  - redis-server
  - python3-venv
  - python3-pip

write_files:
  - path: /home/ubuntu/caching/script.py
    permissions: '0644'
    content: |
      # ---------------------------------------------------
      # KOPIEREN SIE HIER IHR PYTHON-SZENARIO HINEIN.
      # Achten Sie darauf, dass der Python-Code korrekt
      # eingerückt ist (mehr als das Wort 'content: |').
      # ---------------------------------------------------

runcmd:
  - chown -R ubuntu:ubuntu /home/ubuntu/caching
  # Redis Server aktivieren und starten
  - systemctl enable redis-server
  - systemctl start redis-server

  # Python Virtual Environment vorbereiten
  - sudo -u ubuntu python3 -m venv /home/ubuntu/caching/.venv
  - sudo -u ubuntu /home/ubuntu/caching/.venv/bin/pip install redis
